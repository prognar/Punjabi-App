name: Android APK
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: android-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK (release build, debug-signed — for testing, not for the Play Store)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Collect APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk punjabi.apk
      - uses: actions/upload-artifact@v4
        with: { name: punjabi-apk, path: punjabi.apk }
      - name: Publish as the "android-latest" pre-release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest punjabi.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android test build" --notes "Latest test build from main ($GITHUB_SHA). Debug-signed; install by opening the APK on an Android phone."
